<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPC MVP — проектирование корпусной мебели</title>
  <link rel="icon" type="image/svg+xml" href="./assets/logo/plit3d-mark.svg" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #141414;
      color: #cfcfcf;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    .boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px;
      background: #141414;
      text-align: center;
    }

    .boot-loader__brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .boot-loader__mark {
      display: block;
      width: 100px;
      height: 100px;
    }

    .boot-loader__word {
      display: block;
      width: auto;
      height: 34px;
    }

    .boot-loader__spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #3d3d3d;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: boot-loader-spin 0.8s linear infinite;
    }

    @keyframes boot-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-loader__spinner {
        animation-duration: 2s;
      }
    }
  </style>
  <script type="module" crossorigin src="/case3d-app/assets/index-PC-5ftlZ.js"></script>
  <link rel="modulepreload" crossorigin href="/case3d-app/assets/react-BiL0yqXi.js">
  <link rel="modulepreload" crossorigin href="/case3d-app/assets/three-CeMGzNzz.js">
  <link rel="modulepreload" crossorigin href="/case3d-app/assets/three-stdlib-DqVE4T6R.js">
  <link rel="modulepreload" crossorigin href="/case3d-app/assets/r3f-Bw9p_UYf.js">
  <link rel="stylesheet" crossorigin href="/case3d-app/assets/index-CBbFflQZ.css">
</head>

<body>
  <div id="root">
    <div class="boot-loader" role="status" aria-live="polite">
      <span class="boot-loader__brand">
        <img class="boot-loader__mark" src="./assets/logo/plit3d-mark.svg" alt="" aria-hidden="true" />
        <img class="boot-loader__word" src="./assets/logo/plit3d-wordmark.svg" alt="PLIT 3D" />
      </span>
      <span class="boot-loader__spinner" aria-hidden="true"></span>
    </div>
  </div>
</body>

</html>
